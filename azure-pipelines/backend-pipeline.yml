                    $settings = $settings -replace '#{ConnectionStrings:DefaultConnection}#',   '$(ConnectionStrings:DefaultConnection)'
                    $settings = $settings -replace '#{ConnectionStrings:SqlServerConnection}#', '$(ConnectionStrings:SqlServerConnection)'
                    $settings = $settings -replace '#{Jwt:Key}#',                               '$(Jwt:Key)'
                    $settings = $settings -replace '#{Jwt:Issuer}#',                            '$(Jwt:Issuer)'
                    $settings = $settings -replace '#{Jwt:Audience}#',                          '$(Jwt:Audience)'
                    $settings = $settings -replace '#{AllowedOrigins}#',                        '$(AllowedOrigins)'
                    $settings = $settings -replace '#{Email:SmtpHost}#',                        '$(Email:SmtpHost)'
                    $settings = $settings -replace '#{Email:SmtpPort}#',                        '$(Email:SmtpPort)'
                    $settings = $settings -replace '#{Email:SmtpUser}#',                        '$(Email:SmtpUser)'
                    $settings = $settings -replace '#{Email:SmtpPassword}#',                    '$(Email:SmtpPassword)'
