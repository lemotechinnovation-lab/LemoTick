                    Start-Sleep -Seconds 5
                    Write-Host "Deployment complete - Backend (qa) available at: http://localhost:$port"
                  displayName: Deploy to IIS

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
# ==============================================================
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Deploy to IIS (Prod)
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
