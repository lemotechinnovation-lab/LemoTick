# ==============================================================
# LemoTick – Backend Pipeline (.NET 8 API)
# CI:       Azure DevOps  (self-hosted agent on Windows Server VM)
# Deploy:   IIS Application - native Windows deployment
#
# IIS Application mapping:
#   prod  →  LemoTick-Backend-Prod  :5000
#   qa    →  LemoTick-Backend-QA    :5002
#   dev   →  LemoTick-Backend-Dev   :5001
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - backend/**
      - azure-pipelines/backend-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - backend/**

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Build & Test
# ==============================================================
  - stage: Build
    displayName: 'Build & Test'
    variables:
      - group: lemotick-dev
    jobs:
      - job: BuildTest
        displayName: Restore Build Test Publish
        steps:
          - script: dotnet --version
            displayName: Verify .NET version

          - script: dotnet restore
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Restore NuGet packages

          - script: dotnet build --configuration Release --no-restore
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Build (Release)

          - script: dotnet test --no-restore --configuration Release --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Run xUnit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: false

          - script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)/backend --no-restore
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Publish backend

          - task: PublishBuildArtifacts@1
            displayName: Publish artifacts
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              publishLocation: 'Container'

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Deploy to IIS (Dev)
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'backend'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - powershell: |
                    $appPath = "C:\inetpub\wwwroot\lemotick-backend-dev"
                    $appPoolName = "LemoTick-Backend-Dev"
                    $port = 5001
                    
                    Write-Host "Creating application directory"
                    if (-not (Test-Path $appPath)) {
                        New-Item -ItemType Directory -Path $appPath -Force
                    }
                    
                    Write-Host "Stopping IIS site and app pool"
                    Import-Module WebAdministration
                    
                    if (Test-Path "IIS:\AppPools\$appPoolName") {
                        Stop-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                        Start-Sleep -Seconds 3
                    }
                    
                    Write-Host "Copying files"
                    Remove-Item -Path "$appPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(System.ArtifactsDirectory)\backend\*" -Destination $appPath -Recurse -Force
                    
                    Write-Host "Creating app pool"
                    if (-not (Test-Path "IIS:\AppPools\$appPoolName")) {
                        New-WebAppPool -Name $appPoolName
                    }
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name managedRuntimeVersion -Value ""
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name startMode -Value "AlwaysRunning"
                    
                    Write-Host "Creating IIS site"
                    if (Get-Website -Name $appPoolName -ErrorAction SilentlyContinue) {
                        Remove-Website -Name $appPoolName
                    }
                    New-Website -Name $appPoolName -Port $port -PhysicalPath $appPath -ApplicationPool $appPoolName -Force
                    
                    Write-Host "Creating web.config"
                    $webConfigContent = '<?xml version="1.0" encoding="utf-8"?><configuration><location path="." inheritInChildApplications="false"><system.webServer><handlers><add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" /></handlers><aspNetCore processPath="dotnet" arguments=".\LemoTick.API.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess"><environmentVariables><environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Development" /><environmentVariable name="ConnectionStrings__DefaultConnection" value="$(DB_CONNECTION_STRING)" /><environmentVariable name="Jwt__Secret" value="$(JWT_SECRET)" /><environmentVariable name="Jwt__Issuer" value="$(JWT_ISSUER)" /><environmentVariable name="Jwt__Audience" value="$(JWT_AUDIENCE)" /><environmentVariable name="AllowedOrigins" value="$(ALLOWED_ORIGINS)" /></environmentVariables></aspNetCore></system.webServer></location></configuration>'
                    $webConfigContent | Out-File -FilePath "$appPath\web.config" -Encoding UTF8 -Force
                    
                    Write-Host "Starting app pool and site"
                    Start-WebAppPool -Name $appPoolName
                    Start-Website -Name $appPoolName
                    
                    Start-Sleep -Seconds 5
                    Write-Host "Deployment complete - Backend (dev) available at: http://localhost:$port"
                  displayName: Deploy to IIS

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
# ==============================================================
  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
