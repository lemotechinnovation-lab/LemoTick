# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
# ==============================================================
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Deploy to IIS (Prod)
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'backend'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - powershell: |
                    $appPath = "C:\inetpub\wwwroot\lemotick-backend-prod"
                    $appPoolName = "LemoTick-Backend-Prod"
                    $port = 5000

                    if (-not (Test-Path $appPath)) { New-Item -ItemType Directory -Path $appPath -Force }

                    Import-Module WebAdministration
                    if (Test-Path "IIS:\AppPools\$appPoolName") {
                        Stop-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                        Start-Sleep -Seconds 3
                    }

                    Remove-Item -Path "$appPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(System.ArtifactsDirectory)\backend\*" -Destination $appPath -Recurse -Force

                    # Replace #{Token}# placeholders in appsettings.json
                    $settingsPath = "$appPath\appsettings.json"
                    $settings = Get-Content $settingsPath -Raw
                    $settings = $settings -replace '#{ConnectionStrings:DefaultConnection}#',   '$(ConnectionStrings:DefaultConnection)'
                    $settings = $settings -replace '#{ConnectionStrings:SqlServerConnection}#', '$(ConnectionStrings:SqlServerConnection)'
                    $settings = $settings -replace '#{Jwt:Key}#',                               '$(Jwt:Key)'
                    $settings = $settings -replace '#{Jwt:Issuer}#',                            '$(Jwt:Issuer)'
                    $settings = $settings -replace '#{Jwt:Audience}#',                          '$(Jwt:Audience)'
                    $settings = $settings -replace '#{AllowedOrigins}#',                        '$(AllowedOrigins)'
                    $settings = $settings -replace '#{Email:SmtpHost}#',                        '$(Email:SmtpHost)'
                    $settings = $settings -replace '#{Email:SmtpPort}#',                        '$(Email:SmtpPort)'
                    $settings = $settings -replace '#{Email:SmtpUser}#',                        '$(Email:SmtpUser)'
                    $settings = $settings -replace '#{Email:SmtpPassword}#',                    '$(Email:SmtpPassword)'
                    $settings = $settings -replace '#{Email:FromEmail}#',                       '$(Email:FromEmail)'
                    $settings = $settings -replace '#{PayFast:MerchantId}#',                    '$(PayFast:MerchantId)'
                    $settings = $settings -replace '#{PayFast:MerchantKey}#',                   '$(PayFast:MerchantKey)'
                    $settings = $settings -replace '#{PayFast:Passphrase}#',                    '$(PayFast:Passphrase)'
                    $settings | Set-Content $settingsPath -Encoding UTF8
                    Write-Host "Token replacement complete"

                    if (-not (Test-Path "IIS:\AppPools\$appPoolName")) { New-WebAppPool -Name $appPoolName }
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name managedRuntimeVersion -Value ""
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name startMode -Value "AlwaysRunning"

                    if (Get-Website -Name $appPoolName -ErrorAction SilentlyContinue) { Remove-Website -Name $appPoolName }
                    New-Website -Name $appPoolName -Port $port -PhysicalPath $appPath -ApplicationPool $appPoolName -HostHeader "api.lemotechinnovations.co.za" -Force

                    $webConfig = '<?xml version="1.0" encoding="utf-8"?><configuration><location path="." inheritInChildApplications="false"><system.webServer><handlers><add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" /></handlers><aspNetCore processPath="dotnet" arguments=".\InvestorManagementSystem.API.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess"><environmentVariables><environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" /></environmentVariables></aspNetCore></system.webServer></location></configuration>'
                    $webConfig | Out-File -FilePath "$appPath\web.config" -Encoding UTF8 -Force

                    New-Item -ItemType Directory -Path "$appPath\logs" -Force | Out-Null
                    Start-WebAppPool -Name $appPoolName
