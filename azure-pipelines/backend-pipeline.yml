# ==============================================================
# LemoTick – Backend Pipeline (.NET 8 API)
# CI:       Azure DevOps
# Registry: Docker Hub
# Deploy:   Single AlmaLinux 10 VM — all envs on one server
#
# Port mapping on the VM:
#   prod  →  container: lemotick-backend-prod  host port: 5000
#   qa    →  container: lemotick-backend-qa    host port: 5002
#   dev   →  container: lemotick-backend-dev   host port: 5001
#
# Azure DevOps pre-requisites:
#   Service connections:
#     "lemotick-dockerhub-connection"  Docker Registry → Docker Hub
#     "lemotick-ssh"                   SSH → the single AlmaLinux 10 VM
#
#   Variable groups:
#     "lemotick-dev", "lemotick-qa", "lemotick-prod"
#
#   Environments:
#     development / staging / production
#     Add an Approval check on "production".
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - backend/**
      - azure-pipelines/backend-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - backend/**

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  DOCKER_REGISTRY: docker.io
  IMAGE_REPOSITORY: $(DOCKERHUB_USERNAME)/lemotick-backend
  IMAGE_TAG: $(Build.BuildId)
  DOTNET_VERSION: '8.x'
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

# ==============================================================
# STAGE 1 – Build, Test & Push
# ==============================================================
stages:
  - stage: Build
    displayName: '🔨 Build & Test'
    jobs:
      - job: BuildTest
        displayName: Restore · Build · Test · Push image
        steps:
          - task: UseDotNet@2
            displayName: Install .NET $(DOTNET_VERSION)
            inputs:
              version: $(DOTNET_VERSION)

          - script: dotnet restore
            workingDirectory: backend
            displayName: Restore NuGet packages

          - script: dotnet build --configuration Release --no-restore
            workingDirectory: backend
            displayName: Build (Release)

          - script: |
              dotnet test \
                --no-restore \
                --configuration Release \
                --logger trx \
                --results-directory "$(Agent.TempDirectory)/TestResults"
            workingDirectory: backend
            displayName: Run xUnit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: Docker@2
            displayName: Build & push image → Docker Hub
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              command: buildAndPush
              repository: $(IMAGE_REPOSITORY)
              dockerfile: backend/Dockerfile
              containerRegistry: lemotick-dockerhub-connection
              buildContext: backend
              tags: |
                $(IMAGE_TAG)
                $(Build.SourceBranchName)

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
#   Container : lemotick-backend-dev
#   Host port : 5001
# ==============================================================
  - stage: DeployDev
    displayName: '🚀 Deploy → Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Deploy backend-dev on VM
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: Pull & restart lemotick-backend-dev
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e

                      echo "==> Login to Docker Hub"
                      echo "$(DOCKERHUB_TOKEN)" | docker login \
                        -u $(DOCKERHUB_USERNAME) --password-stdin

                      echo "==> Pull $(IMAGE_REPOSITORY):$(IMAGE_TAG)"
                      docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      echo "==> Stop & remove old container"
                      docker stop lemotick-backend-dev 2>/dev/null || true
                      docker rm   lemotick-backend-dev 2>/dev/null || true

                      echo "==> Start lemotick-backend-dev on port 5001"
                      docker run -d \
                        --name lemotick-backend-dev \
                        --restart unless-stopped \
                        -p 5001:8080 \
                        -e "ASPNETCORE_ENVIRONMENT=Development" \
                        -e "ConnectionStrings__DefaultConnection=$(DB_CONNECTION_STRING)" \
                        -e "Jwt__Secret=$(JWT_SECRET)" \
                        -e "Jwt__Issuer=$(JWT_ISSUER)" \
                        -e "Jwt__Audience=$(JWT_AUDIENCE)" \
                        -e "AllowedOrigins=$(ALLOWED_ORIGINS)" \
                        $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      sleep 8
                      docker ps --filter "name=lemotick-backend-dev" \
                        --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                      docker image prune -f

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
#   Container : lemotick-backend-qa
#   Host port : 5002
# ==============================================================
  - stage: DeployQA
    displayName: '🚀 Deploy → QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: Deploy backend-qa on VM
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: Pull & restart lemotick-backend-qa
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e

                      echo "==> Login to Docker Hub"
                      echo "$(DOCKERHUB_TOKEN)" | docker login \
                        -u $(DOCKERHUB_USERNAME) --password-stdin

                      echo "==> Pull $(IMAGE_REPOSITORY):$(IMAGE_TAG)"
                      docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      echo "==> Stop & remove old container"
                      docker stop lemotick-backend-qa 2>/dev/null || true
                      docker rm   lemotick-backend-qa 2>/dev/null || true

                      echo "==> Start lemotick-backend-qa on port 5002"
                      docker run -d \
                        --name lemotick-backend-qa \
                        --restart unless-stopped \
                        -p 5002:8080 \
                        -e "ASPNETCORE_ENVIRONMENT=Staging" \
                        -e "ConnectionStrings__DefaultConnection=$(DB_CONNECTION_STRING)" \
                        -e "Jwt__Secret=$(JWT_SECRET)" \
                        -e "Jwt__Issuer=$(JWT_ISSUER)" \
                        -e "Jwt__Audience=$(JWT_AUDIENCE)" \
                        -e "AllowedOrigins=$(ALLOWED_ORIGINS)" \
                        $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      sleep 8
                      docker ps --filter "name=lemotick-backend-qa" \
                        --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                      docker image prune -f

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
#   Container : lemotick-backend-prod
#   Host port : 5000
#   ⚠  Add Approval check on "production" Environment
# ==============================================================
  - stage: DeployProd
    displayName: '🚀 Deploy → Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Deploy backend-prod on VM
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: Pull & restart lemotick-backend-prod
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e

                      echo "==> Login to Docker Hub"
                      echo "$(DOCKERHUB_TOKEN)" | docker login \
                        -u $(DOCKERHUB_USERNAME) --password-stdin

                      echo "==> Pull $(IMAGE_REPOSITORY):$(IMAGE_TAG)"
                      docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      echo "==> Stop & remove old container"
                      docker stop lemotick-backend-prod 2>/dev/null || true
                      docker rm   lemotick-backend-prod 2>/dev/null || true

                      echo "==> Start lemotick-backend-prod on port 5000"
                      docker run -d \
                        --name lemotick-backend-prod \
                        --restart unless-stopped \
                        -p 5000:8080 \
                        -e "ASPNETCORE_ENVIRONMENT=Production" \
                        -e "ConnectionStrings__DefaultConnection=$(DB_CONNECTION_STRING)" \
                        -e "Jwt__Secret=$(JWT_SECRET)" \
                        -e "Jwt__Issuer=$(JWT_ISSUER)" \
                        -e "Jwt__Audience=$(JWT_AUDIENCE)" \
                        -e "AllowedOrigins=$(ALLOWED_ORIGINS)" \
                        $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                      sleep 8
                      docker ps --filter "name=lemotick-backend-prod" \
                        --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                      docker image prune -f

# ==============================================================
# Variable group keys (lemotick-dev / qa / prod)
# --------------------------------------------------------------
#   DOCKERHUB_USERNAME       Docker Hub username         (not secret)
#   DOCKERHUB_TOKEN          Docker Hub access token     🔒 secret
#   DB_CONNECTION_STRING     PostgreSQL conn string      🔒 secret
#   JWT_SECRET               JWT signing key             🔒 secret
#   JWT_ISSUER               e.g. http://<vm-ip>:8080   (dev)
#   JWT_AUDIENCE             e.g. http://<vm-ip>:8080   (dev)
#   ALLOWED_ORIGINS          e.g. http://<vm-ip>:8080   (dev)
# ==============================================================
