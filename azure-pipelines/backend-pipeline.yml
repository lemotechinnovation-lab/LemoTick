# ==============================================================
# LemoTick – Backend Pipeline (.NET 8 API)
# CI:       Azure DevOps  (self-hosted agent on Windows Server VM)
# Deploy:   IIS Application - native Windows deployment
#
# IIS Application mapping:
#   prod  →  LemoTick-Backend-Prod  :5000
#   qa    →  LemoTick-Backend-QA    :5002
#   dev   →  LemoTick-Backend-Dev   :5001
#
# Variable group keys must match appsettings.json token names:
#   ConnectionStrings:DefaultConnection
#   ConnectionStrings:SqlServerConnection
#   Jwt:Key
#   Jwt:Issuer
#   Jwt:Audience
#   AllowedOrigins
#   Email:SmtpHost
#   Email:SmtpPort
#   Email:SmtpUser
#   Email:SmtpPassword
#   Email:FromEmail
#   PayFast:MerchantId
#   PayFast:MerchantKey
#   PayFast:Passphrase
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - backend/**
      - azure-pipelines/backend-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - backend/**

pool:
  name: Default

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Build & Test
# ==============================================================
  - stage: Build
    displayName: 'Build & Test'
    variables:
      - group: lemotick-dev
    jobs:
      - job: BuildTest
        displayName: Restore Build Test Publish
        steps:
          - script: dotnet --version
            displayName: Verify .NET version

          - script: dotnet restore InvestorManagementSystem.sln
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Restore NuGet packages

          - script: dotnet build InvestorManagementSystem.sln --configuration Release --no-restore
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Build (Release)

          - script: dotnet test InvestorManagementSystem.sln --no-restore --configuration Release --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Run xUnit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: false

          - script: dotnet publish API/InvestorManagementSystem.API.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/backend --no-restore
            workingDirectory: $(Build.SourcesDirectory)/backend
            displayName: Publish backend

          - task: PublishBuildArtifacts@1
            displayName: Publish artifacts
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              publishLocation: 'Container'

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Deploy to IIS (Dev)
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'backend'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - powershell: |
                    $appPath = "C:\inetpub\wwwroot\lemotick-backend-dev"
                    $appPoolName = "LemoTick-Backend-Dev"
                    $port = 5001

                    if (-not (Test-Path $appPath)) { New-Item -ItemType Directory -Path $appPath -Force }

                    Import-Module WebAdministration
                    if (Test-Path "IIS:\AppPools\$appPoolName") {
                        Stop-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                        Start-Sleep -Seconds 3
                    }

                    Remove-Item -Path "$appPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(System.ArtifactsDirectory)\backend\*" -Destination $appPath -Recurse -Force

                    # Replace #{Token}# placeholders in appsettings.json
                    $settingsPath = "$appPath\appsettings.json"
                    $settings = Get-Content $settingsPath -Raw
                    $settings = $settings -replace '#{ConnectionStrings:DefaultConnection}#',   '$(ConnectionStrings:DefaultConnection)'
                    $settings = $settings -replace '#{ConnectionStrings:SqlServerConnection}#', '$(ConnectionStrings:SqlServerConnection)'
                    $settings = $settings -replace '#{Jwt:Key}#',                               '$(Jwt:Key)'
                    $settings = $settings -replace '#{Jwt:Issuer}#',                            '$(Jwt:Issuer)'
                    $settings = $settings -replace '#{Jwt:Audience}#',                          '$(Jwt:Audience)'
                    $settings = $settings -replace '#{AllowedOrigins}#',                        '$(AllowedOrigins)'
                    $settings = $settings -replace '#{Email:SmtpHost}#',                        '$(Email:SmtpHost)'
                    $settings = $settings -replace '#{Email:SmtpPort}#',                        '$(Email:SmtpPort)'
                    $settings = $settings -replace '#{Email:SmtpUser}#',                        '$(Email:SmtpUser)'
                    $settings = $settings -replace '#{Email:SmtpPassword}#',                    '$(Email:SmtpPassword)'
                    $settings = $settings -replace '#{Email:FromEmail}#',                       '$(Email:FromEmail)'
                    $settings = $settings -replace '#{PayFast:MerchantId}#',                    '$(PayFast:MerchantId)'
                    $settings = $settings -replace '#{PayFast:MerchantKey}#',                   '$(PayFast:MerchantKey)'
                    $settings = $settings -replace '#{PayFast:Passphrase}#',                    '$(PayFast:Passphrase)'
                    $settings | Set-Content $settingsPath -Encoding UTF8
                    Write-Host "Token replacement complete"

                    if (-not (Test-Path "IIS:\AppPools\$appPoolName")) { New-WebAppPool -Name $appPoolName }
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name managedRuntimeVersion -Value ""
                    Set-ItemProperty "IIS:\AppPools\$appPoolName" -Name startMode -Value "AlwaysRunning"

                    if (Get-Website -Name $appPoolName -ErrorAction SilentlyContinue) { Remove-Website -Name $appPoolName }
                    New-Website -Name $appPoolName -Port $port -PhysicalPath $appPath -ApplicationPool $appPoolName -Force

                    $webConfig = '<?xml version="1.0" encoding="utf-8"?><configuration><location path="." inheritInChildApplications="false"><system.webServer><handlers><add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" /></handlers><aspNetCore processPath="dotnet" arguments=".\InvestorManagementSystem.API.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess"><environmentVariables><environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Development" /></environmentVariables></aspNetCore></system.webServer></location></configuration>'
                    $webConfig | Out-File -FilePath "$appPath\web.config" -Encoding UTF8 -Force

                    New-Item -ItemType Directory -Path "$appPath\logs" -Force | Out-Null
                    Start-WebAppPool -Name $appPoolName
                    Start-Website -Name $appPoolName
                    Start-Sleep -Seconds 5
                    Write-Host "Deployment complete - Backend (dev) at http://localhost:$port"
                  displayName: Deploy to IIS (Dev)

# ==============================================================
