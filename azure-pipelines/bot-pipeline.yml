# ==============================================================
# LemoTick – Bot Pipeline (Python Trading Bot)
# CI:       Azure DevOps  (self-hosted agent on the same VM)
# Registry: Docker Hub
# Deploy:   Direct docker commands — agent runs ON the server
#
# Container names:
#   prod  →  lemotick-bot-prod
#   qa    →  lemotick-bot-qa
#   dev   →  lemotick-bot-dev
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - lemotickautostart/**
      - deployment/docker/Dockerfile.bot
      - azure-pipelines/bot-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - lemotickautostart/**
      - deployment/docker/Dockerfile.bot

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  DOCKER_REGISTRY: docker.io
  IMAGE_REPOSITORY: $(DOCKERHUB_USERNAME)/lemotick-bot
  IMAGE_TAG: $(Build.BuildId)
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Lint, Build & Push
# ==============================================================
  - stage: Build
    displayName: '🔨 Build Bot Image'
    variables:
      - group: lemotick-dev
    jobs:
      - job: BuildImage
        displayName: Lint · Docker build & push
        steps:
          - script: python3 --version
            displayName: Verify Python version

          - script: |
              python3 -m pip install flake8
              python3 -m flake8 lemotickautostart/src \
                --max-line-length=120 \
                --exclude=__pycache__,.git \
                --ignore=E501,W503
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Lint Python source
            continueOnError: true

          - script: |
              echo "$(DOCKERHUB_TOKEN)" | docker login -u $(DOCKERHUB_USERNAME) --password-stdin
              docker build -t $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG) \
                           -t $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(Build.SourceBranchName) \
                           -f $(Build.SourcesDirectory)/deployment/docker/Dockerfile.bot \
                           $(Build.SourcesDirectory)
              docker push $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)
              docker push $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(Build.SourceBranchName)
            displayName: Build & push bot image → Docker Hub
            condition: and(succeeded(), eq(variables['IS_PR'], false))

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: '🚀 Deploy → Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Deploy lemotick-bot-dev
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    echo "$(DOCKERHUB_TOKEN)" | docker login -u $(DOCKERHUB_USERNAME) --password-stdin
                    docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    docker stop lemotick-bot-dev 2>/dev/null || true
                    docker rm   lemotick-bot-dev 2>/dev/null || true

                    mkdir -p /var/log/lemotick-bot-dev
                    docker run -d \
                      --name lemotick-bot-dev \
                      --restart unless-stopped \
                      -e "DERIV_API_TOKEN=$(DERIV_API_TOKEN)" \
                      -e "BACKEND_API_URL=$(BACKEND_API_URL)" \
                      -e "BACKEND_API_KEY=$(BACKEND_API_KEY)" \
                      -e "ENV=development" \
                      -v /var/log/lemotick-bot-dev:/app/logs \
                      $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    sleep 8
                    docker ps --filter "name=lemotick-bot-dev" \
                      --format "table {{.Names}}\t{{.Status}}"
                    docker logs --tail 20 lemotick-bot-dev
                    docker image prune -f
                  displayName: Run lemotick-bot-dev

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
# ==============================================================
  - stage: DeployQA
    displayName: '🚀 Deploy → QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: Deploy lemotick-bot-qa
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    echo "$(DOCKERHUB_TOKEN)" | docker login -u $(DOCKERHUB_USERNAME) --password-stdin
                    docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    docker stop lemotick-bot-qa 2>/dev/null || true
                    docker rm   lemotick-bot-qa 2>/dev/null || true

                    mkdir -p /var/log/lemotick-bot-qa
                    docker run -d \
                      --name lemotick-bot-qa \
                      --restart unless-stopped \
                      -e "DERIV_API_TOKEN=$(DERIV_API_TOKEN)" \
                      -e "BACKEND_API_URL=$(BACKEND_API_URL)" \
                      -e "BACKEND_API_KEY=$(BACKEND_API_KEY)" \
                      -e "ENV=staging" \
                      -v /var/log/lemotick-bot-qa:/app/logs \
                      $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    sleep 8
                    docker ps --filter "name=lemotick-bot-qa" \
                      --format "table {{.Names}}\t{{.Status}}"
                    docker logs --tail 20 lemotick-bot-qa
                    docker image prune -f
                  displayName: Run lemotick-bot-qa

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
#   ⚠  Add Approval check on "production" Environment
# ==============================================================
  - stage: DeployProd
    displayName: '🚀 Deploy → Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Deploy lemotick-bot-prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    echo "$(DOCKERHUB_TOKEN)" | docker login -u $(DOCKERHUB_USERNAME) --password-stdin
                    docker pull $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    docker stop lemotick-bot-prod 2>/dev/null || true
                    docker rm   lemotick-bot-prod 2>/dev/null || true

                    mkdir -p /var/log/lemotick-bot-prod
                    docker run -d \
                      --name lemotick-bot-prod \
                      --restart unless-stopped \
                      -e "DERIV_API_TOKEN=$(DERIV_API_TOKEN)" \
                      -e "BACKEND_API_URL=$(BACKEND_API_URL)" \
                      -e "BACKEND_API_KEY=$(BACKEND_API_KEY)" \
                      -e "ENV=production" \
                      -v /var/log/lemotick-bot-prod:/app/logs \
                      $(DOCKER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

                    sleep 8
                    docker ps --filter "name=lemotick-bot-prod" \
                      --format "table {{.Names}}\t{{.Status}}"
                    docker logs --tail 20 lemotick-bot-prod
                    docker image prune -f
                  displayName: Run lemotick-bot-prod
