# ==============================================================
# LemoTick – Bot Pipeline (Python Trading Bot)
# CI:       Azure DevOps  (self-hosted agent on Windows Server VM)
# Deploy:   Windows Service using NSSM (Non-Sucking Service Manager)
#
# Service names:
#   prod  →  LemoTick-Bot-Prod
#   qa    →  LemoTick-Bot-QA
#   dev   →  LemoTick-Bot-Dev
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - lemotickautostart/**
      - azure-pipelines/bot-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - lemotickautostart/**

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Lint & Package
# ==============================================================
  - stage: Build
    displayName: 'Build Bot Package'
    variables:
      - group: lemotick-dev
    jobs:
      - job: BuildPackage
        displayName: Lint and Package bot files
        steps:
          - script: python --version
            displayName: Verify Python version

          - script: python -m pip install flake8 && python -m flake8 lemotickautostart/src --max-line-length=120 --exclude=__pycache__,.git --ignore=E501,W503
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Lint Python source
            continueOnError: true

          - task: CopyFiles@2
            displayName: Copy bot files to staging
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/lemotickautostart'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/bot'

          - task: PublishBuildArtifacts@1
            displayName: Publish bot artifacts
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/bot'
              ArtifactName: 'bot'
              publishLocation: 'Container'

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Deploy as Windows Service (Dev)
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'bot'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - powershell: |
                    $serviceName = "LemoTick-Bot-Dev"
                    $appPath = "C:\LemoTick\Bot\Dev"
                    $logPath = "C:\lemotick-logs\bot-dev"
                    $pythonExe = "python.exe"
                    $mainScript = "main.py"
                    
                    Write-Host "Creating application directory"
                    if (-not (Test-Path $appPath)) {
                        New-Item -ItemType Directory -Path $appPath -Force
                    }
                    if (-not (Test-Path $logPath)) {
                        New-Item -ItemType Directory -Path $logPath -Force
                    }
                    
                    Write-Host "Stopping service if running"
                    $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
                    if ($service) {
                        if ($service.Status -eq 'Running') {
                            Stop-Service -Name $serviceName -Force
                            Start-Sleep -Seconds 3
                        }
                    }
                    
                    Write-Host "Copying bot files"
                    Remove-Item -Path "$appPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(System.ArtifactsDirectory)\bot\*" -Destination $appPath -Recurse -Force
                    
                    Write-Host "Installing Python dependencies"
                    & python -m pip install -r "$appPath\requirements.txt" --quiet
                    
                    Write-Host "Creating environment file"
                    "DERIV_API_TOKEN=$(DERIV_API_TOKEN)" | Out-File -FilePath "$appPath\.env" -Encoding UTF8
                    "BACKEND_API_URL=$(BACKEND_API_URL)" | Out-File -FilePath "$appPath\.env" -Encoding UTF8 -Append
                    "BACKEND_API_KEY=$(BACKEND_API_KEY)" | Out-File -FilePath "$appPath\.env" -Encoding UTF8 -Append
                    "ENV=development" | Out-File -FilePath "$appPath\.env" -Encoding UTF8 -Append
                    "LOG_PATH=$logPath" | Out-File -FilePath "$appPath\.env" -Encoding UTF8 -Append
                    
                    Write-Host "Installing Windows Service with NSSM"
                    $nssmPath = "C:\nssm\nssm.exe"
                    if (-not (Test-Path $nssmPath)) {
                        Write-Host "Installing NSSM..."
                        $nssmZip = "$env:TEMP\nssm.zip"
                        Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile $nssmZip
                        Expand-Archive -Path $nssmZip -DestinationPath "$env:TEMP\nssm" -Force
                        New-Item -ItemType Directory -Path "C:\nssm" -Force
                        Copy-Item -Path "$env:TEMP\nssm\nssm-2.24\win64\nssm.exe" -Destination $nssmPath -Force
                    }
                    
                    if ($service) {
                        & $nssmPath stop $serviceName
                        & $nssmPath remove $serviceName confirm
                    }
                    
                    & $nssmPath install $serviceName $pythonExe "$appPath\$mainScript"
                    & $nssmPath set $serviceName AppDirectory $appPath
                    & $nssmPath set $serviceName DisplayName "LemoTick Trading Bot (Development)"
                    & $nssmPath set $serviceName Description "LemoTick automated trading bot - Development environment"
                    & $nssmPath set $serviceName Start SERVICE_AUTO_START
                    & $nssmPath set $serviceName AppStdout "$logPath\service-stdout.log"
                    & $nssmPath set $serviceName AppStderr "$logPath\service-stderr.log"
                    & $nssmPath set $serviceName AppRotateFiles 1
                    & $nssmPath set $serviceName AppRotateBytes 10485760
                    
                    Write-Host "Starting service"
                    Start-Service -Name $serviceName
                    Start-Sleep -Seconds 5
                    
                    $serviceStatus = Get-Service -Name $serviceName
                    Write-Host "Service status: $($serviceStatus.Status)"
                    
                    if (Test-Path "$logPath\service-stdout.log") {
                        Write-Host "Recent logs:"
                        Get-Content "$logPath\service-stdout.log" -Tail 20
                    }
                  displayName: Deploy bot as Windows Service

