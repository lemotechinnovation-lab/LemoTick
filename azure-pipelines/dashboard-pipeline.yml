# ==============================================================
# LemoTick – Dashboard Pipeline (React + Vite SPA)
# CI:     Azure DevOps  (self-hosted agent on Windows Server VM)
# Deploy: Direct copy to IIS web root — agent runs ON the server
#
# Each environment builds with its own variable group so
# VITE_* env vars are correctly baked into the bundle.
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - admin-dashboard/**
      - azure-pipelines/dashboard-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - admin-dashboard/**

pool:
  name: Default

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Lint & Type-check only (no build, no env vars needed)
# ==============================================================
  - stage: Validate
    displayName: 'Lint & Type-check'
    jobs:
      - job: Validate
        displayName: Lint · Type-check
        steps:
          - script: node --version && npm --version
            displayName: Verify Node.js version

          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Install dependencies

          - script: npm run lint
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Lint
            continueOnError: true

          - script: npx tsc --noEmit
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Type check
            continueOnError: true

# ==============================================================
# STAGE 2a – Build & Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: 'Build & Deploy → Development'
    dependsOn: Validate
    condition: |
      and(
        succeeded('Validate'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Build & Deploy (Dev)
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: npm ci
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Install dependencies

                - script: npm run build
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Vite build (dev)
                  env:
                    VITE_API_BASE_URL: $(VITE_API_BASE_URL)
                    VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)
                    VITE_SOCIAL_SIGNALR_HUB_URL: $(VITE_SOCIAL_SIGNALR_HUB_URL)
                    VITE_ENABLE_REAL_TIME_UPDATES: $(VITE_ENABLE_REAL_TIME_UPDATES)
                    VITE_ENABLE_2FA: $(VITE_ENABLE_2FA)
                    VITE_DERIV_APP_ID: $(VITE_DERIV_APP_ID)
                    VITE_DERIV_WS_ENDPOINT: $(VITE_DERIV_WS_ENDPOINT)

                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-dev"
                    $siteName = "LemoTick-Dashboard-Dev"
                    $port = 8080

                    if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force

                    $acl = Get-Acl $destPath
                    $acl.SetAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")))
                    Set-Acl $destPath $acl

                    Import-Module WebAdministration
                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port $port -PhysicalPath $destPath -Force
                    }
                    try { Start-Website -Name $siteName -ErrorAction Stop } catch {}
                    Write-Host "==> Dashboard (dev) deployed → https://dev.lemotechinnovations.co.za"
                  displayName: Deploy to IIS (Dev)

# ==============================================================
# STAGE 2b – Build & Deploy → QA  (branch: qa)
# ==============================================================
  - stage: DeployQA
    displayName: 'Build & Deploy → QA'
    dependsOn: Validate
    condition: |
      and(
        succeeded('Validate'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: Build & Deploy (QA)
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: npm ci
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Install dependencies

                - script: npm run build
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Vite build (qa)
                  env:
                    VITE_API_BASE_URL: $(VITE_API_BASE_URL)
                    VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)
                    VITE_SOCIAL_SIGNALR_HUB_URL: $(VITE_SOCIAL_SIGNALR_HUB_URL)
                    VITE_ENABLE_REAL_TIME_UPDATES: $(VITE_ENABLE_REAL_TIME_UPDATES)
                    VITE_ENABLE_2FA: $(VITE_ENABLE_2FA)
                    VITE_DERIV_APP_ID: $(VITE_DERIV_APP_ID)
                    VITE_DERIV_WS_ENDPOINT: $(VITE_DERIV_WS_ENDPOINT)

                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-qa"
                    $siteName = "LemoTick-Dashboard-QA"
                    $port = 8090

                    if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force

                    $acl = Get-Acl $destPath
                    $acl.SetAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")))
                    Set-Acl $destPath $acl

                    Import-Module WebAdministration
                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port $port -PhysicalPath $destPath -Force
                    }
                    try { Start-Website -Name $siteName -ErrorAction Stop } catch {}
                    Write-Host "==> Dashboard (qa) deployed → https://qa.lemotechinnovations.co.za"
                  displayName: Deploy to IIS (QA)

# ==============================================================
# STAGE 2c – Build & Deploy → Production  (branch: main / master)
# ==============================================================
  - stage: DeployProd
    displayName: 'Build & Deploy → Production'
    dependsOn: Validate
    condition: |
      and(
        succeeded('Validate'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Build & Deploy (Prod)
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: npm ci
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Install dependencies

                - script: npm run build
                  workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
                  displayName: Vite build (prod)
                  env:
                    VITE_API_BASE_URL: $(VITE_API_BASE_URL)
                    VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)
                    VITE_SOCIAL_SIGNALR_HUB_URL: $(VITE_SOCIAL_SIGNALR_HUB_URL)
                    VITE_ENABLE_REAL_TIME_UPDATES: $(VITE_ENABLE_REAL_TIME_UPDATES)
                    VITE_ENABLE_2FA: $(VITE_ENABLE_2FA)
                    VITE_DERIV_APP_ID: $(VITE_DERIV_APP_ID)
                    VITE_DERIV_WS_ENDPOINT: $(VITE_DERIV_WS_ENDPOINT)

                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-prod"
                    $siteName = "LemoTick-Dashboard-Prod"

                    if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force

                    $acl = Get-Acl $destPath
                    $acl.SetAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")))
                    Set-Acl $destPath $acl

                    Import-Module WebAdministration
                    $defaultSite = Get-Website -Name "Default Web Site" -ErrorAction SilentlyContinue
                    if ($defaultSite -and $defaultSite.State -eq "Started") {
                        Stop-Website -Name "Default Web Site" -ErrorAction SilentlyContinue
                    }

                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port 443 -PhysicalPath $destPath -Force
                    }
                    try { Start-Website -Name $siteName -ErrorAction Stop } catch {}
                    Write-Host "==> Dashboard (prod) deployed → https://lemotechinnovations.co.za"
                  displayName: Deploy to IIS (Prod)
