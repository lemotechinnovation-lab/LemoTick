# ==============================================================
# LemoTick – Dashboard Pipeline (React + Vite SPA)
# CI:     Azure DevOps  (self-hosted agent on Windows Server VM)
# Deploy: Direct copy to IIS web root — agent runs ON the server
#
# IIS port mapping:
#   prod  →  port 80   →  C:\inetpub\wwwroot\lemotick-prod
#   qa    →  port 8090 →  C:\inetpub\wwwroot\lemotick-qa
#   dev   →  port 8080 →  C:\inetpub\wwwroot\lemotick-dev
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - admin-dashboard/**
      - azure-pipelines/dashboard-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - admin-dashboard/**

pool:
  name: Default

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Install, Lint, Type-check & Build
# ==============================================================
  - stage: Build
    displayName: '🔨 Build'
    jobs:
      - job: Build
        displayName: Install · Lint · Type-check · Vite build
        steps:
          - script: node --version && npm --version
            displayName: Verify Node.js version

          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Install dependencies (ci)

          - script: npm run lint
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Lint
            continueOnError: true

          - script: npx tsc --noEmit
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Type check
            continueOnError: true

          - script: npm run build
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Vite build
            env:
              VITE_API_BASE_URL: $(VITE_API_BASE_URL)
              VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: '🚀 Deploy → Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Copy dist → /var/www/lemotick-dev
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-dev"
                    $siteName = "LemoTick-Dashboard-Dev"
                    $port = 8080
                    
                    Write-Host "==> Creating directory"
                    if (-not (Test-Path $destPath)) {
                        New-Item -ItemType Directory -Path $destPath -Force
                    }
                    
                    Write-Host "==> Removing old files"
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Copying new build"
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force
                    
                    Write-Host "==> Setting IIS permissions"
                    $acl = Get-Acl $destPath
                    $accessRule = New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")
                    $acl.SetAccessRule($accessRule)
                    Set-Acl $destPath $acl
                    
                    Write-Host "==> Configuring IIS site"
                    Import-Module WebAdministration
                    
                    # Create or update site
                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port $port -PhysicalPath $destPath -Force
                    }
                    
                    # Ensure site is started
                    Start-Website -Name $siteName -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Dashboard (dev) deployed → http://YOUR_SERVER_IP:$port"
                  displayName: Deploy dashboard (dev)

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
# ==============================================================
  - stage: DeployQA
    displayName: '🚀 Deploy → QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: Copy dist → /var/www/lemotick-qa
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-qa"
                    $siteName = "LemoTick-Dashboard-QA"
                    $port = 8090
                    
                    Write-Host "==> Creating directory"
                    if (-not (Test-Path $destPath)) {
                        New-Item -ItemType Directory -Path $destPath -Force
                    }
                    
                    Write-Host "==> Removing old files"
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Copying new build"
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force
                    
                    Write-Host "==> Setting IIS permissions"
                    $acl = Get-Acl $destPath
                    $accessRule = New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")
                    $acl.SetAccessRule($accessRule)
                    Set-Acl $destPath $acl
                    
                    Write-Host "==> Configuring IIS site"
                    Import-Module WebAdministration
                    
                    # Create or update site
                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port $port -PhysicalPath $destPath -Force
                    }
                    
                    # Ensure site is started
                    Start-Website -Name $siteName -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Dashboard (qa) deployed → http://YOUR_SERVER_IP:$port"
                  displayName: Deploy dashboard (qa)

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
#   ⚠  Add Approval check on "production" Environment
# ==============================================================
  - stage: DeployProd
    displayName: '🚀 Deploy → Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Copy dist → /var/www/lemotick-prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - powershell: |
                    $destPath = "C:\inetpub\wwwroot\lemotick-prod"
                    $siteName = "LemoTick-Dashboard-Prod"
                    $port = 80
                    
                    Write-Host "==> Creating directory"
                    if (-not (Test-Path $destPath)) {
                        New-Item -ItemType Directory -Path $destPath -Force
                    }
                    
                    Write-Host "==> Removing old files"
                    Remove-Item -Path "$destPath\*" -Recurse -Force -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Copying new build"
                    Copy-Item -Path "$(Build.SourcesDirectory)\admin-dashboard\dist\*" -Destination $destPath -Recurse -Force
                    
                    Write-Host "==> Setting IIS permissions"
                    $acl = Get-Acl $destPath
                    $accessRule = New-Object System.Security.AccessControl.FileSystemAccessRule("IIS_IUSRS","ReadAndExecute","ContainerInherit,ObjectInherit","None","Allow")
                    $acl.SetAccessRule($accessRule)
                    Set-Acl $destPath $acl
                    
                    Write-Host "==> Configuring IIS site"
                    Import-Module WebAdministration
                    
                    # Stop default website if it's using port 80
                    Stop-Website -Name "Default Web Site" -ErrorAction SilentlyContinue
                    
                    # Create or update site
                    if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
                        Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $destPath
                    } else {
                        New-Website -Name $siteName -Port $port -PhysicalPath $destPath -Force
                    }
                    
                    # Ensure site is started
                    Start-Website -Name $siteName -ErrorAction SilentlyContinue
                    
                    Write-Host "==> Dashboard (prod) deployed → http://YOUR_SERVER_IP"
                  displayName: Deploy dashboard (prod)
