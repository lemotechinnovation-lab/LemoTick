# ==============================================================
# LemoTick – Dashboard Pipeline (React + Vite SPA)
# CI:     Azure DevOps  (self-hosted agent on the same VM)
# Deploy: Direct cp to Nginx web root — agent runs ON the server
#
# Nginx port mapping:
#   prod  →  port 80   →  /var/www/lemotick-prod
#   qa    →  port 8090 →  /var/www/lemotick-qa
#   dev   →  port 8080 →  /var/www/lemotick-dev
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - admin-dashboard/**
      - azure-pipelines/dashboard-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - admin-dashboard/**

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
# ==============================================================
# STAGE 1 – Install, Lint, Type-check & Build
# ==============================================================
  - stage: Build
    displayName: '🔨 Build'
    jobs:
      - job: Build
        displayName: Install · Lint · Type-check · Vite build
        steps:
          - script: node --version && npm --version
            displayName: Verify Node.js version

          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Install dependencies (ci)

          - script: npm run lint
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Lint
            continueOnError: true

          - script: npx tsc --noEmit
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Type check
            continueOnError: true

          - script: npm run build
            workingDirectory: $(Build.SourcesDirectory)/admin-dashboard
            displayName: Vite build
            env:
              VITE_API_BASE_URL: $(VITE_API_BASE_URL)
              VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
# ==============================================================
  - stage: DeployDev
    displayName: '🚀 Deploy → Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: Copy dist → /var/www/lemotick-dev
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    mkdir -p /var/www/lemotick-dev
                    rm -rf /var/www/lemotick-dev/*
                    cp -r $(Build.SourcesDirectory)/admin-dashboard/dist/. /var/www/lemotick-dev/
                    chown -R nginx:nginx /var/www/lemotick-dev
                    chmod -R 755 /var/www/lemotick-dev
                    chcon -Rt httpd_sys_content_t /var/www/lemotick-dev 2>/dev/null || true
                    nginx -t && systemctl reload nginx
                    echo "==> Dashboard (dev) deployed → http://154.66.196.172:8080"
                  displayName: Deploy dashboard (dev)

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
# ==============================================================
  - stage: DeployQA
    displayName: '🚀 Deploy → QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: Copy dist → /var/www/lemotick-qa
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    mkdir -p /var/www/lemotick-qa
                    rm -rf /var/www/lemotick-qa/*
                    cp -r $(Build.SourcesDirectory)/admin-dashboard/dist/. /var/www/lemotick-qa/
                    chown -R nginx:nginx /var/www/lemotick-qa
                    chmod -R 755 /var/www/lemotick-qa
                    chcon -Rt httpd_sys_content_t /var/www/lemotick-qa 2>/dev/null || true
                    nginx -t && systemctl reload nginx
                    echo "==> Dashboard (qa) deployed → http://154.66.196.172:8090"
                  displayName: Deploy dashboard (qa)

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
#   ⚠  Add Approval check on "production" Environment
# ==============================================================
  - stage: DeployProd
    displayName: '🚀 Deploy → Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: Copy dist → /var/www/lemotick-prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    set -e
                    mkdir -p /var/www/lemotick-prod
                    rm -rf /var/www/lemotick-prod/*
                    cp -r $(Build.SourcesDirectory)/admin-dashboard/dist/. /var/www/lemotick-prod/
                    chown -R nginx:nginx /var/www/lemotick-prod
                    chmod -R 755 /var/www/lemotick-prod
                    chcon -Rt httpd_sys_content_t /var/www/lemotick-prod 2>/dev/null || true
                    nginx -t && systemctl reload nginx
                    echo "==> Dashboard (prod) deployed → http://154.66.196.172"
                  displayName: Deploy dashboard (prod)
