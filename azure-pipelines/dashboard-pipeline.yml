# ==============================================================
# LemoTick – Dashboard Pipeline (React + Vite SPA)
# CI:     Azure DevOps
# Deploy: Single AlmaLinux 10 VM — all envs on one server via SCP → Nginx
#
# Nginx port mapping on the VM:
#   prod  →  port 80   →  /var/www/lemotick-prod
#   qa    →  port 8090 →  /var/www/lemotick-qa
#   dev   →  port 8080 →  /var/www/lemotick-dev
#
# Azure DevOps pre-requisites:
#   Service connections:
#     "lemotick-ssh"   SSH → the single AlmaLinux 10 VM
#
#   Variable groups:
#     "lemotick-dev", "lemotick-qa", "lemotick-prod"
#
#   Environments:
#     development / staging / production
#     Add an Approval check on "production".
# ==============================================================

trigger:
  branches:
    include:
      - dev
      - qa
      - main
      - master
  paths:
    include:
      - admin-dashboard/**
      - azure-pipelines/dashboard-pipeline.yml

pr:
  branches:
    include:
      - dev
      - qa
      - main
  paths:
    include:
      - admin-dashboard/**

pool:
  name: Default
  demands:
    - agent.name -equals lemotick-vm

variables:
  NODE_VERSION: '20.x'
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

# ==============================================================
# STAGE 1 – Install, Lint, Type-check & Build
# ==============================================================
stages:
  - stage: Build
    displayName: '🔨 Build'
    jobs:
      - job: Build
        displayName: Install · Lint · Type-check · Vite build
        steps:
          - task: NodeTool@0
            displayName: Use Node.js $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            workingDirectory: admin-dashboard
            displayName: Install dependencies (ci)

          - script: npm run lint
            workingDirectory: admin-dashboard
            displayName: Lint
            continueOnError: true

          - script: npx tsc --noEmit
            workingDirectory: admin-dashboard
            displayName: Type check
            continueOnError: true

          - script: npm run build
            workingDirectory: admin-dashboard
            displayName: Vite build
            env:
              VITE_API_BASE_URL: $(VITE_API_BASE_URL)
              VITE_SIGNALR_HUB_URL: $(VITE_SIGNALR_HUB_URL)

          - task: PublishBuildArtifacts@1
            displayName: Publish dist as pipeline artifact
            condition: and(succeeded(), eq(variables['IS_PR'], false))
            inputs:
              PathtoPublish: admin-dashboard/dist
              ArtifactName: dashboard-dist
              publishLocation: Container

# ==============================================================
# STAGE 2a – Deploy → Development  (branch: dev)
#   Web root : /var/www/lemotick-dev
#   Nginx    : port 8080
# ==============================================================
  - stage: DeployDev
    displayName: '🚀 Deploy → Development'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    variables:
      - group: lemotick-dev
    jobs:
      - deployment: DeployDev
        displayName: SCP → /var/www/lemotick-dev
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dashboard-dist
                  displayName: Download dist artifact

                - task: SSH@0
                  displayName: Prepare web root (dev)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      mkdir -p /var/www/lemotick-dev
                      chown -R $USER:$USER /var/www/lemotick-dev

                - task: CopyFilesOverSSH@0
                  displayName: SCP dist/ → /var/www/lemotick-dev
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    sourceFolder: $(Pipeline.Workspace)/dashboard-dist
                    contents: '**'
                    targetFolder: /var/www/lemotick-dev
                    cleanTargetFolder: true
                    readyTimeout: '20000'

                - task: SSH@0
                  displayName: Fix permissions & reload Nginx (dev)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e
                      chown -R nginx:nginx /var/www/lemotick-dev
                      chmod -R 755 /var/www/lemotick-dev
                      chcon -Rt httpd_sys_content_t /var/www/lemotick-dev
                      nginx -t
                      systemctl reload nginx
                      echo "==> Dashboard (dev) deployed — http://$(hostname -I | awk '{print $1}'):8080"

# ==============================================================
# STAGE 2b – Deploy → QA  (branch: qa)
#   Web root : /var/www/lemotick-qa
#   Nginx    : port 8090
# ==============================================================
  - stage: DeployQA
    displayName: '🚀 Deploy → QA'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        eq(variables['Build.SourceBranchName'], 'qa')
      )
    variables:
      - group: lemotick-qa
    jobs:
      - deployment: DeployQA
        displayName: SCP → /var/www/lemotick-qa
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dashboard-dist
                  displayName: Download dist artifact

                - task: SSH@0
                  displayName: Prepare web root (qa)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      mkdir -p /var/www/lemotick-qa
                      chown -R $USER:$USER /var/www/lemotick-qa

                - task: CopyFilesOverSSH@0
                  displayName: SCP dist/ → /var/www/lemotick-qa
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    sourceFolder: $(Pipeline.Workspace)/dashboard-dist
                    contents: '**'
                    targetFolder: /var/www/lemotick-qa
                    cleanTargetFolder: true
                    readyTimeout: '20000'

                - task: SSH@0
                  displayName: Fix permissions & reload Nginx (qa)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e
                      chown -R nginx:nginx /var/www/lemotick-qa
                      chmod -R 755 /var/www/lemotick-qa
                      chcon -Rt httpd_sys_content_t /var/www/lemotick-qa
                      nginx -t
                      systemctl reload nginx
                      echo "==> Dashboard (qa) deployed — http://$(hostname -I | awk '{print $1}'):8090"

# ==============================================================
# STAGE 2c – Deploy → Production  (branch: main / master)
#   Web root : /var/www/lemotick-prod
#   Nginx    : port 80
#   ⚠  Add Approval check on "production" Environment
# ==============================================================
  - stage: DeployProd
    displayName: '🚀 Deploy → Production'
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        eq(variables['IS_PR'], false),
        in(variables['Build.SourceBranchName'], 'main', 'master')
      )
    variables:
      - group: lemotick-prod
    jobs:
      - deployment: DeployProd
        displayName: SCP → /var/www/lemotick-prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dashboard-dist
                  displayName: Download dist artifact

                - task: SSH@0
                  displayName: Prepare web root (prod)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      mkdir -p /var/www/lemotick-prod
                      chown -R $USER:$USER /var/www/lemotick-prod

                - task: CopyFilesOverSSH@0
                  displayName: SCP dist/ → /var/www/lemotick-prod
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    sourceFolder: $(Pipeline.Workspace)/dashboard-dist
                    contents: '**'
                    targetFolder: /var/www/lemotick-prod
                    cleanTargetFolder: true
                    readyTimeout: '20000'

                - task: SSH@0
                  displayName: Fix permissions & reload Nginx (prod)
                  inputs:
                    sshEndpoint: lemotick-ssh-connection
                    runOptions: inline
                    inline: |
                      set -e
                      chown -R nginx:nginx /var/www/lemotick-prod
                      chmod -R 755 /var/www/lemotick-prod
                      chcon -Rt httpd_sys_content_t /var/www/lemotick-prod
                      nginx -t
                      systemctl reload nginx
                      echo "==> Dashboard (prod) deployed — http://$(hostname -I | awk '{print $1}')"

# ==============================================================
# Variable group keys (lemotick-dev / qa / prod)
# --------------------------------------------------------------
#   VITE_API_BASE_URL      dev: http://<ip>:8080  qa: http://<ip>:8090  prod: http://<ip>
#   VITE_SIGNALR_HUB_URL   same pattern as above
# ==============================================================
