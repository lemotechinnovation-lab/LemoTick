name: lemotick-investor

services:
  postgres:
    image: postgres:16-alpine
    container_name: lemotick-investor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: InvestorManagementSystemDb
      POSTGRES_USER: lemotick_user
      POSTGRES_PASSWORD: lemotick_secure_password_123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - lemotick-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U lemotick_user -d InvestorManagementSystemDb",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lemotick-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lemotick.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - lemotick-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: lemotick_investor_postgres_data
  pgadmin_data:
    name: lemotick_pgadmin_data

networks:
  lemotick-network:
    name: lemotick-network
    driver: bridge
