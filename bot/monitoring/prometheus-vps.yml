global:
  scrape_interval: 5s  # 5-second scraping for VPS monitoring
  evaluation_interval: 5s

rule_files:
  - "lemotick_rules.yml"

scrape_configs:
  # LemoTick Bot Metrics (running as systemd service)
  - job_name: 'lemotick-bot'
    static_configs:
      - targets: ['172.17.0.1:8000']  # Docker bridge gateway
    scrape_interval: 5s
    metrics_path: /
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.17.0.1:9100']
    scrape_interval: 15s

  # Systemd service status
  - job_name: 'systemd-services'
    static_configs:
      - targets: ['host.docker.internal:9557']
    scrape_interval: 30s
