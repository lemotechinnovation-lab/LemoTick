services:
  # LemoTick Bot
  lemotick-bot:
    build:
      context: ..
      dockerfile: bot/docker/Dockerfile
    container_name: lemotick-bot
    restart: unless-stopped
    ports:
      - "9092:9092" # Prometheus metrics port

    environment:
      # Load environment variables from docker.env
      - DERIV_API_TOKEN=${DERIV_API_TOKEN}
      - DERIV_WS_URL=${DERIV_WS_URL:-wss://ws.derivws.com/websockets/v3}
      - DERIV_APP_ID=${DERIV_APP_ID:-1089}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
      - PROMETHEUS_PORT=9092
      - LEMOTICK_LIVE_ACCOUNT=true # Enable live trading
      - LEMOTICK_CONFIRM_LIVE=true # Auto-confirm live trading

    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      - ./bot/config:/app/src/config:ro
      # Mount logs directory
      - ./logs:/app/logs
      # Mount config directory (read-only)
      - ./config:/app/config:ro

    networks:
      - lemotick-network

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database for the backend
  lemotick-postgres:
    image: postgres:15-alpine
    container_name: lemotick-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=InvestorManagementSystemDb
      - POSTGRES_USER=lemotick_user
      - POSTGRES_PASSWORD=lemotick_secure_password_123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lemotick-network

      # Health check
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U lemotick_user -d InvestorManagementSystemDb",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/lemotick_rules.yml:/etc/prometheus/lemotick_rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - lemotick-network

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lemotick-network

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - ./logs:/var/log/lemotick:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - lemotick-network
    depends_on:
      - loki

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - lemotick-network
    depends_on:
      - prometheus
      - loki

  # Redis - Optional caching
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lemotick-network

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  redis_data:
  postgres_data:

networks:
  lemotick-network:
    driver: bridge
