auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-10-27
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 0
  max_query_parallelism: 32
  max_entries_limit_per_query: 0
  max_query_length: "0h"
  max_query_lookback: "0h"
  max_label_name_length: 0
  max_label_value_length: 0
  max_label_names_per_series: 0
  max_chunks_per_query: 0
  max_streams_matchers_per_query: 0
  max_concurrent_tail_requests: 0
  max_cache_freshness_per_query: "0"
  per_stream_rate_limit: "0"
  per_stream_rate_limit_burst: "0"

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true